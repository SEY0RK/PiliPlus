name: Fold6 Debug APK
on:
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Patch Flutter SDK / pub get
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Prepare version and dart-defines
        shell: pwsh
        run: lib/scripts/build.ps1 android
      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=pili_release.json --no-pub
      - name: Rename
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-debug.apk PiliPlus_fold6_debug.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-fold6-debug-apk
          path: PiliPlus_fold6_debug.apk
          if-no-files-found: error
          archive: false
